# Static site + one function for the shared dispatch state.
# Deploy with "Import from Git" (not drag & drop): functions are only published that way.
[build]
  publish = "public"
  command = ""

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# the service worker is checked on every visit so updates arrive right away
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
