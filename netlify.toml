# Sitio estático + una función para el estado compartido de despacho.
# Desplegar con "Import from Git" (no drag & drop): las funciones sólo se publican así.
[build]
  publish = "public"
  command = ""

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# el service worker se revisa en cada visita para que las actualizaciones lleguen al momento
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
